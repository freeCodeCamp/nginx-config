# The application behind this vhost sets its own copy of each header that
# snippets/common/security.conf adds. Hide the application copy so the
# client receives one value per header, the one this repo controls.

proxy_hide_header X-Frame-Options;
proxy_hide_header X-XSS-Protection;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
